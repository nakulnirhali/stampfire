<!-- This HTML file displays a logo that is responsive to screen size.
On mobile devices, the logo takes up to 80% of the viewport width.
On desktop devices, it reduces to 40% of the viewport width. -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stampfire</title>

  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="manifest" href="site.webmanifest">

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }

    .poster {
      position: relative;
      display: inline-block;
      max-width: 80%;
      transform: scale(0.9);
    }

    .poster img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Transparent clickable area */
    .whatsapp-link {
      position: absolute;
      bottom: 5%;      /* adjust vertically */
      left: 10%;       /* adjust horizontally */
      width: 80%;      /* cover just the number area */
      height: 12%;     /* height of number band */
      cursor: pointer;
    }

    /* On desktop: smaller poster */
    @media (min-width: 768px) {
      .poster {
        max-width: 40%;
      }
    }
  </style>
</head>

<body>
  <div class="poster">
    <img src="logo.png" alt="Logo">
    <a class="whatsapp-link" href="https://wa.me/919869234902" target="_blank"></a>
  </div>
</body>

</html>
